name: Validate site

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          base_path: ${{ steps.pages.outputs.base_path }}
