title: Cesar Rios
description: Building software. Refining judgment.
url: "https://rioscesar.github.io"
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
permalink: /writing/:title/
github_username: rioscesar

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - notes/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - scripts/
  - test/
  - STATE.md

future: false
unpublished: false
